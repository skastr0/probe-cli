name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm
    runs-on: macos-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release version
        id: release-version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" = "0.0.0" ]; then
            echo "Refusing to publish placeholder version 0.0.0."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check npm version availability
        id: npm-availability
        shell: bash
        run: |
          version="${{ steps.release-version.outputs.version }}"
          packages=(
            "@skastr0/probe-darwin-arm64"
            "@skastr0/probe-darwin-x64"
            "@skastr0/probe"
          )

          existing=0
          missing=0

          for package in "${packages[@]}"; do
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "${package}@${version} already exists on npm."
              existing=$((existing + 1))
            else
              echo "${package}@${version} is available for publish."
              missing=$((missing + 1))
            fi
          done

          if [ "${existing}" -gt 0 ] && [ "${missing}" -gt 0 ]; then
            echo "Refusing partial publish state: ${existing} existing package(s), ${missing} missing package(s)."
            exit 1
          fi

          if [ "${existing}" -gt 0 ]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "All package versions already exist on npm; skipping publish."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify
        run: bun run verify

      - name: Prepare npm packages
        run: bun run prepare:npm

      - name: Validate npm packages
        run: bun run validate:npm

      - name: Publish platform packages
        if: steps.npm-availability.outputs.publish == 'true'
        run: |
          npm publish ./packages/probe-darwin-arm64 --access public
          npm publish ./packages/probe-darwin-x64 --access public

      - name: Publish launcher package
        if: steps.npm-availability.outputs.publish == 'true'
        run: npm publish ./packages/probe --access public
