name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm
    runs-on: macos-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" = "0.0.0" ]; then
            echo "Refusing to publish placeholder version 0.0.0."
            exit 1
          fi

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi

      - name: Verify
        run: bun run verify

      - name: Prepare npm packages
        run: bun run prepare:npm

      - name: Validate npm packages
        run: bun run validate:npm

      - name: Publish platform packages
        run: |
          npm publish ./packages/probe-darwin-arm64 --access public
          npm publish ./packages/probe-darwin-x64 --access public

      - name: Publish launcher package
        run: npm publish ./packages/probe --access public
